<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ember Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&display=swap">
<style>
  /* The v2 look (docs/gui-v2-style.md): Oxanium, near-black, cards, a ring of ticks. Colours are the firmware's Ember theme. */
  :root {
    color-scheme: dark;
    --bg: #000; --surface: #141920; --surface-hi: #252c36; --track: #232a33;
    --text: #f3f5f8; --text-2: #9aa5b4; --text-3: #5c6877; --idle: #6f8196;
    --heat: #ff8a1f; --hot: #ff2a1a; --ok: #34c759; --fault: #ff3b30; --bt: #3d8bff;
    --font: "Oxanium", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { min-height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 700 16px/1.35 var(--font); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--bt); outline-offset: 3px; }
  button:disabled { opacity: .4; cursor: default; }
  [hidden] { display: none !important; }
  .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: max(18px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left)); }

  /* ---- Landing ---- */
  #start { justify-content: center; gap: 26px; text-align: center; }
  .mark { font-size: 44px; font-weight: 800; letter-spacing: .22em; color: var(--heat); margin-right: -.22em; }
  .hint { margin: 0; color: var(--text-2); font-size: 15px; font-weight: 500; line-height: 1.6; }
  .hint b { color: var(--text); font-weight: 700; }
  #btnConnect { min-width: 240px; padding: 16px 28px; border-radius: 16px; background: var(--heat); color: #1a0e05; font-size: 20px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
  #btnConnect:active { filter: brightness(.9); }
  #msg { max-width: 330px; min-height: 1.4em; color: var(--text-2); font-size: 14px; font-weight: 500; }
  #msg.err { color: #ffb4a8; }

  /* ---- Connected ---- */
  #live { width: 100%; max-width: 560px; margin: 0 auto; gap: 12px; }
  .top { width: 100%; display: flex; align-items: center; gap: 10px; }
  .top .bt { flex: none; }
  .top .name { flex: 1; min-width: 0; color: var(--heat); font-size: 15px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill { border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; background: var(--surface-hi); color: var(--text-2); }
  #btnAllOff.hot { background: var(--fault); color: #fff; }
  .tiles { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .tiles[data-n="1"] { display: none; }
  .tiles[data-n="3"] { grid-template-columns: repeat(3, 1fr); }
  .tiles[data-n="4"] { grid-template-columns: repeat(2, 1fr); }
  .tile { position: relative; background: var(--surface); border-radius: 16px; padding: 10px 10px 10px; text-align: left; border: 1.5px solid transparent; display: grid; grid-template-columns: 58px 1fr; gap: 6px 10px; align-items: center; }
  .tile.sel { border-color: var(--surface-hi); background: #181e26; }
  .tile.heating { border-color: color-mix(in srgb, var(--c) 55%, transparent); }
  .tile.fault { border-color: var(--fault); }
  .tile svg { width: 58px; height: 58px; grid-row: span 2; }
  .tile .nm { font-size: 13px; color: var(--text-2); font-weight: 700; }
  .tile .tv { font-size: 26px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .ts { font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--c, var(--idle)); }
  .panel { width: 100%; background: var(--surface); border-radius: 22px; padding: 14px 14px 16px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .panel h2 { margin: 0; align-self: flex-start; font-size: 14px; letter-spacing: .14em; text-transform: uppercase; color: var(--heat); font-weight: 800; }
  .gauge { position: relative; width: min(78vw, 320px); aspect-ratio: 1; }
  .gauge svg { width: 100%; height: 100%; display: block; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #status { font-size: 13px; font-weight: 800; letter-spacing: .16em; color: var(--idle); text-transform: uppercase; margin-bottom: 2px; }
  #pv { font-size: clamp(56px, 19vw, 84px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  #pv small { font-size: .36em; color: var(--text-2); font-weight: 700; margin-left: 2px; vertical-align: .95em; }
  #meta { margin-top: 4px; font-size: 14px; font-weight: 700; color: var(--text-2); font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  #fault { width: 100%; background: rgba(255, 59, 48, .12); border: 1.5px solid rgba(255, 59, 48, .6); color: #ffb4a8; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px; font-weight: 700; }
  #fault span { flex: 1; }
  #fault button { background: var(--fault); color: #fff; border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 800; letter-spacing: .06em; }
  .set { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .set button { flex: none; width: 60px; height: 60px; border-radius: 50%; background: var(--surface-hi); font-size: 32px; font-weight: 700; line-height: 1; }
  .set .val { display: flex; align-items: center; gap: 8px; font-size: 38px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .set .val svg { width: 18px; height: 18px; opacity: .7; }
  .actions { width: 100%; display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
  .actions button { padding: 16px 0; border-radius: 16px; font-size: 18px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  #btnRun { background: var(--ok); color: #04210d; }
  #btnRun.stop { background: var(--surface-hi); color: var(--text); }
  #btnBoost { background: var(--surface-hi); color: var(--text); }
  #btnBoost.on { background: rgba(255, 138, 31, .16); color: var(--heat); box-shadow: inset 0 0 0 1.5px var(--heat); }
  #note { min-height: 1.2em; color: var(--text-2); font-size: 13px; font-weight: 500; text-align: center; }
  details { width: 100%; color: var(--text-2); font-size: 13px; font-weight: 500; }
  summary { cursor: pointer; padding: 6px 0; }
  #log { margin: 6px 0 0; padding: 10px; background: var(--surface); border-radius: 12px; max-height: 170px; overflow: auto; white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #diag { margin-top: 8px; word-break: break-word; }
  @media (prefers-reduced-motion: no-preference) { .tick { transition: stroke .35s ease; } }
</style>
</head>
<body>

<section class="screen" id="start">
  <div class="mark">EMBER</div>
  <button id="btnConnect">Connect</button>
  <p class="hint">Turn on Bluetooth on your Ember first:<br><b>Settings › Connect › Connect phone</b></p>
  <div id="msg" role="status"></div>
</section>

<section class="screen" id="live" hidden>
  <div class="top">
    <svg class="bt" width="14" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 7.5L17 17L12 21.5V2.5L17 7L6.5 16.5" fill="none" stroke="#3d8bff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="name" id="devName">Ember</span>
    <button class="pill" id="btnAllOff">All off</button>
    <button class="pill" id="btnDisconnect" aria-label="Disconnect">✕</button>
  </div>

  <div class="tiles" id="tiles" data-n="1"></div>

  <div class="panel">
    <h2 id="heaterName">Heater 1</h2>
    <div class="gauge">
      <svg viewBox="0 0 200 200" id="ring" aria-hidden="true"></svg>
      <div class="center">
        <div id="status">OFF</div>
        <div id="pv">---<small id="unit">°F</small></div>
        <div id="meta"></div>
      </div>
    </div>
    <div id="fault" hidden><span id="faultText"></span><button id="btnClear">Clear</button></div>
    <div class="set">
      <button id="btnDown" aria-label="Target down">−</button>
      <div class="val"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="#9aa5b4" stroke-width="2"/><circle cx="12" cy="12" r="2.2" fill="#9aa5b4"/></svg><span id="spEdit">---</span></div>
      <button id="btnUp" aria-label="Target up">+</button>
    </div>
    <div class="actions">
      <button id="btnRun">Start</button>
      <button id="btnBoost">Boost</button>
    </div>
    <div id="note"></div>
  </div>

  <details>
    <summary>Activity</summary>
    <pre id="log" aria-live="polite"></pre>
    <div id="diag"></div>
  </details>
</section>

<script type="module">
import { SERVICE, INFO, STATE, COMMAND, OP, RESULT_TEXT, FAULT_TEXT, encodeCommand, decodeInfo, decodeState, tenths, toUnit, fromUnit } from './codec.mjs';

const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent = `${new Date().toLocaleTimeString()}  ${s}\n` + $('log').textContent; };
const STEP = 5;      // target step, display units
const TICKS = 60, START = 135, SWEEP = 270;  // the ring: 60 ticks over 270 degrees, as on the device

let dev = null, info = null, state = null, seq = 0, pending = new Map(), sel = 0;
let spWant = null, spTimer = null;  // a target being dialled in, sent when the taps stop

const hasBt = () => !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
const diag = () => `https: ${window.isSecureContext ? 'yes' : 'no'} · bluetooth: ${navigator.bluetooth ? 'yes' : 'no'} · ${navigator.userAgent}`;
function say(text, err) { $('msg').textContent = text; $('msg').classList.toggle('err', !!err); }

// ---- Bluetooth ----
async function connectBle() {
  const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }], optionalServices: [SERVICE] });
  say('Connecting…');
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  const [ci, cs, cc] = await Promise.all([svc.getCharacteristic(INFO), svc.getCharacteristic(STATE), svc.getCharacteristic(COMMAND)]);
  const d = {
    name: device.name || 'Ember',
    info: decodeInfo(await ci.readValue()),
    read: async () => decodeState(await cs.readValue()),
    write: (b) => (cc.writeValueWithResponse ? cc.writeValueWithResponse(b) : cc.writeValue(b)),
    onState: async (cb) => {
      cs.addEventListener('characteristicvaluechanged', async (e) => cb(decodeState(e.target.value) || await d.read()));
      await cs.startNotifications();
    },
    disconnect: () => device.gatt.connected && device.gatt.disconnect(),
  };
  device.addEventListener('gattserverdisconnected', () => { log('Disconnected.'); showLanding('Disconnected.'); });
  return d;
}

function showLanding(text, err) {
  dev = null; state = null; pending.clear(); spWant = null;
  $('live').hidden = true; $('start').hidden = false;
  $('btnConnect').disabled = false;
  say(text || '', err);
}

$('btnConnect').onclick = async () => {
  $('diag').textContent = diag();
  if (!hasBt()) {
    say(window.isSecureContext ? 'This browser can’t use Bluetooth. On iPhone, open this page in Bluefy; elsewhere use Chrome or Edge.'
                               : 'Bluetooth needs this page over https.', true);
    return;
  }
  $('btnConnect').disabled = true;
  say('Choose your Ember…');
  try {
    dev = await connectBle();
    info = dev.info;
    log(`${info.boardName}, firmware ${info.fw}, ${info.zones} heater${info.zones > 1 ? 's' : ''}. Max ${fmt(info.spMaxC)}. Remote start ${info.remoteStart ? 'on' : 'off'}.`);
    say('Pairing… type the code shown on your Ember if asked.');
    const s = await dev.read();  // the first protected read asks to pair
    $('devName').textContent = dev.name;
    $('unit').textContent = info.fahrenheit ? '°F' : '°C';
    sel = 0;
    buildTiles(s ? s.zones.length : info.zones);
    $('start').hidden = true; $('live').hidden = false;
    show(s);
    await dev.onState(show);
    log('Live.');
  } catch (e) {
    const m = e && e.name === 'NotFoundError' ? '' : `Couldn’t connect: ${e.message || e}`;
    if (m) log(m);
    if (dev) dev.disconnect();
    showLanding(m, !!m);
  }
};
$('btnDisconnect').onclick = () => dev && dev.disconnect();

// ---- The ring: 60 ticks, lit up to the temperature, a longer white tick at the target ----
const NS = 'http://www.w3.org/2000/svg';
function ringTicks(svg, r0, r1, big) {
  svg.textContent = '';
  const tickList = [];
  for (let i = 0; i < TICKS; i++) {
    const a = (START + SWEEP * i / (TICKS - 1)) * Math.PI / 180, c = Math.cos(a), s = Math.sin(a);
    const l = document.createElementNS(NS, 'line');
    l.setAttribute('x1', (100 + r0 * c).toFixed(2)); l.setAttribute('y1', (100 + r0 * s).toFixed(2));
    l.setAttribute('x2', (100 + r1 * c).toFixed(2)); l.setAttribute('y2', (100 + r1 * s).toFixed(2));
    l.setAttribute('stroke', 'var(--track)'); l.setAttribute('stroke-width', big ? 3.4 : 5); l.setAttribute('stroke-linecap', 'round'); l.setAttribute('class', 'tick');
    svg.appendChild(l); tickList.push(l);
  }
  const m = document.createElementNS(NS, 'line');
  m.setAttribute('stroke', '#fff'); m.setAttribute('stroke-width', big ? 4 : 6); m.setAttribute('stroke-linecap', 'round');
  svg.appendChild(m);
  svg._t = tickList; svg._m = m; svg._r = [r0, r1];
}
function paintRing(svg, frac, spFrac, color) {
  const lit = Math.round(Math.max(0, Math.min(1, frac)) * (TICKS - 1));
  svg._t.forEach((l, i) => l.setAttribute('stroke', frac > 0 && i <= lit ? color : 'var(--track)'));
  const a = (START + SWEEP * Math.max(0, Math.min(1, spFrac))) * Math.PI / 180, [r0, r1] = svg._r, ext = (r1 - r0) * 0.55;
  svg._m.setAttribute('x1', (100 + (r0 - ext) * Math.cos(a)).toFixed(2)); svg._m.setAttribute('y1', (100 + (r0 - ext) * Math.sin(a)).toFixed(2));
  svg._m.setAttribute('x2', (100 + (r0 + 2) * Math.cos(a)).toFixed(2)); svg._m.setAttribute('y2', (100 + (r0 + 2) * Math.sin(a)).toFixed(2));
}
ringTicks($('ring'), 70, 92, true);

// ---- Heaters: a tile each (when there is more than one) and the selected heater below ----
const fmt = (c) => (c == null ? '---' : `${Math.round(toUnit(c, info?.fahrenheit))}${info?.fahrenheit ? '°F' : '°C'}`);
const disp = (c) => Math.round(toUnit(c, info.fahrenheit));
const nameOf = (i) => `Heater ${i + 1}`;
function look(z) {  // colour and words for one heater, as the device's tiles
  const running = z.mode === 1, tuning = z.mode === 2;
  const reached = z.pv != null && z.sp > 0 && z.pv >= z.sp - 2;
  const hot = z.pv != null && z.pv >= 51.7;
  const color = z.fault ? 'var(--fault)' : running ? (reached ? 'var(--hot)' : 'var(--heat)') : hot ? 'var(--heat)' : 'var(--idle)';
  const text = z.fault ? 'FAULT' : running ? `HEATING ${z.out}%` : tuning ? 'TUNING' : hot ? 'OFF · HOT' : 'OFF';
  return { running, tuning, color, text, on: running || tuning };
}
function buildTiles(n) {
  const box = $('tiles');
  box.textContent = '';
  box.dataset.n = String(n);
  for (let i = 0; i < n; i++) {
    const t = document.createElement('button');
    t.className = 'tile';
    t.innerHTML = '<svg viewBox="0 0 200 200" aria-hidden="true"></svg><span class="nm"></span><span><span class="tv">---</span><br><span class="ts">OFF</span></span>';
    ringTicks(t.querySelector('svg'), 66, 94, false);
    t.onclick = () => { sel = i; spWant = null; if (state) show(state); };
    box.appendChild(t);
  }
}

function show(s) {
  if (!s) return;
  state = s;
  const n = s.zones.length;
  if ($('tiles').children.length !== n) { buildTiles(n); sel = Math.min(sel, n - 1); }
  const max = info.spMaxC || 427;
  [...$('tiles').children].forEach((t, i) => {
    const z = s.zones[i], k = look(z);
    t.classList.toggle('sel', i === sel); t.classList.toggle('heating', k.on); t.classList.toggle('fault', !!z.fault);
    t.style.setProperty('--c', k.color);
    t.querySelector('.nm').textContent = nameOf(i);
    t.querySelector('.tv').textContent = z.pv == null ? '---' : `${disp(z.pv)}°`;
    t.querySelector('.ts').textContent = k.text;
    paintRing(t.querySelector('svg'), z.pv == null ? 0 : z.pv / max, z.sp / max, k.color);
  });

  const c = s.zones[sel], k = look(c);
  $('heaterName').textContent = n > 1 ? nameOf(sel) : 'Heater';
  $('pv').firstChild.nodeValue = c.pv == null ? '---' : disp(c.pv);
  $('status').textContent = k.text;
  $('status').style.color = k.color;
  $('meta').textContent = `target ${fmt(c.sp)}${c.boost ? ' · boost' : ''}` + (s.autoOffLeftS ? ` · auto-off ${Math.floor(s.autoOffLeftS / 60)}:${String(s.autoOffLeftS % 60).padStart(2, '0')}` : '');
  paintRing($('ring'), c.pv == null ? 0 : c.pv / max, c.sp / max, k.color);

  const f = c.fault;
  $('fault').hidden = !f;
  $('faultText').textContent = f ? `Fault: ${FAULT_TEXT[f] || f}` : '';

  if (spWant == null) $('spEdit').textContent = `${disp(c.sp)}°${info.fahrenheit ? 'F' : 'C'}`;
  $('btnRun').textContent = k.on ? 'Stop' : 'Start';
  $('btnRun').classList.toggle('stop', k.on);
  $('btnRun').disabled = !k.on && !info.remoteStart;
  $('btnBoost').classList.toggle('on', c.boost);
  $('btnBoost').textContent = c.boost ? 'Boost on' : 'Boost';
  $('btnBoost').disabled = !k.running && !c.boost;
  const any = s.zones.some((z) => z.mode !== 0);
  $('btnAllOff').classList.toggle('hot', any);
  $('btnAllOff').hidden = n < 2;
  $('note').textContent = !k.on && !info.remoteStart ? 'Starting from the phone is off. Turn on Settings › Safety › Remote start on your Ember.' : '';

  const want = pending.get(s.ackSeq);
  if (want && s.ackResult) {
    pending.delete(s.ackSeq);
    log(`${want}: ${RESULT_TEXT[s.ackResult] || s.ackResult}`);
    if (s.ackResult !== 1) $('note').textContent = `${want}: ${RESULT_TEXT[s.ackResult] || 'refused'}`;
  }
}

// ---- Commands ----
async function send(op, zone, value, label) {
  if (!dev) return;
  seq = ((seq + 1) & 0xff) || 1;
  pending.set(seq, label);
  try { await dev.write(encodeCommand(seq, op, zone, value)); }
  catch (e) { pending.delete(seq); log(`${label}: not sent (${e.message || e})`); }
}

function nudge(dir) {
  if (!state) return;
  const max = Math.floor(toUnit(info.spMaxC, info.fahrenheit)), min = Math.ceil(toUnit(info.spMinC, info.fahrenheit));
  const base = spWant ?? disp(state.zones[sel].sp), z = sel;
  spWant = Math.max(min, Math.min(max, Math.round((base + dir * STEP) / STEP) * STEP));
  $('spEdit').textContent = `${spWant}°${info.fahrenheit ? 'F' : 'C'}`;
  clearTimeout(spTimer);
  spTimer = setTimeout(() => {  // sent once the taps stop, like the device settling
    const d = spWant; spWant = null;
    send(OP.SETPOINT, z, tenths(fromUnit(d, info.fahrenheit)), `${nameOf(z)} to ${d}${info.fahrenheit ? '°F' : '°C'}`);
  }, 700);
}
$('btnUp').onclick = () => nudge(1);
$('btnDown').onclick = () => nudge(-1);
$('btnRun').onclick = () => {
  const on = state && state.zones[sel].mode !== 0;
  send(on ? OP.STOP : OP.START, sel, 0, `${on ? 'Stop' : 'Start'} ${nameOf(sel)}`);
};
$('btnBoost').onclick = () => { const on = !(state && state.zones[sel].boost); send(OP.BOOST, sel, on ? 1 : 0, `${on ? 'Boost' : 'Cancel boost'} ${nameOf(sel)}`); };
$('btnClear').onclick = () => send(OP.CLEAR, sel, 0, `Clear fault, ${nameOf(sel)}`);
$('btnAllOff').onclick = () => {  // stopping is always accepted: one STOP for each heater that is on
  if (!state) return;
  state.zones.forEach((z, i) => { if (z.mode !== 0) send(OP.STOP, i, 0, `Stop ${nameOf(i)}`); });
};
</script>
</body>
</html>
