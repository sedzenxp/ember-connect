<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090b">
<title>Ember Connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap">
<style>
  /* Dark only, like the device. Colours are the firmware's (ui.h): heat orange, at-temp red, off grey-blue. */
  :root {
    color-scheme: dark;
    --bg: #08090b; --panel: #14181e; --row: #1c222b; --line: #2a323d; --ink: #eef1f5; --dim: #8a97a8;
    --heat: #ff8c1a; --hot: #ff2a1a; --off: #5a6b7d; --go: #1e8e3e; --fault: #ff3b30; --bt: #3d8bff;
    --font: "Montserrat", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 500 16px/1.4 var(--font); }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--bt); outline-offset: 3px; }
  button:disabled { opacity: .35; cursor: default; }
  [hidden] { display: none !important; }
  .screen { min-height: 100%; display: flex; flex-direction: column; align-items: center; padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }

  /* ---- Landing: the wordmark and Connect, nothing else ---- */
  #start { justify-content: center; gap: 28px; }
  .hint { margin: 0; text-align: center; color: var(--dim); font-size: 14px; line-height: 1.6; }
  .hint b { color: var(--ink); font-weight: 600; }
  #btnConnect { width: min(78vw, 300px); padding: 18px 0; border-radius: 999px; background: var(--heat); color: #1a0b02;
    font-size: 19px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; box-shadow: 0 8px 30px rgba(255, 120, 20, .35); }
  #btnConnect:active { transform: scale(.98); }
  #msg { max-width: 320px; text-align: center; color: var(--dim); font-size: 14px; min-height: 1.4em; }
  #msg.err { color: #ffb4a8; }

  /* ---- Connected ---- */
  #live { gap: 18px; max-width: 460px; margin: 0 auto; }
  .bar { width: 100%; display: flex; align-items: center; gap: 10px; }
  .bar .name { flex: 1; color: var(--dim); font-size: 14px; letter-spacing: .04em; }
  .bar .bt { color: var(--bt); font-size: 18px; line-height: 1; }
  .bar button { background: var(--row); color: var(--dim); border-radius: 999px; padding: 8px 14px; font-size: 13px; }
  .gauge { position: relative; width: min(84vw, 340px); aspect-ratio: 1; }
  .gauge svg { width: 100%; height: 100%; display: block; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  #status { font-size: 15px; font-weight: 700; letter-spacing: .12em; color: var(--off); }
  #pv { font-size: clamp(60px, 21vw, 92px); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; margin: 4px 0; }
  #pv small { font-size: .38em; color: var(--dim); font-weight: 600; margin-left: 2px; vertical-align: .9em; }
  #spLine { font-size: 17px; color: var(--dim); font-weight: 600; font-variant-numeric: tabular-nums; }
  #spLine b { color: var(--ink); }
  .meta { display: flex; gap: 22px; color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--ink); font-weight: 600; }
  #fault { width: 100%; background: rgba(255, 59, 48, .12); border: 1px solid rgba(255, 59, 48, .5); color: #ffb4a8; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; font-weight: 600; }
  #fault span { flex: 1; }
  #fault button { background: var(--fault); color: #fff; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; }
  .set { width: 100%; display: flex; align-items: center; justify-content: space-between; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 10px; }
  .set button { width: 64px; height: 64px; border-radius: 50%; background: var(--row); font-size: 30px; font-weight: 600; }
  .set .val { text-align: center; }
  .set .val div { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .set .val span { font-size: 12px; color: var(--dim); letter-spacing: .14em; text-transform: uppercase; }
  .actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .actions button { padding: 18px 0; border-radius: 18px; font-size: 17px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  #btnRun { background: var(--go); color: #fff; }
  #btnRun.stop { background: var(--hot); }
  #btnBoost { background: var(--row); border: 1px solid var(--line); }
  #btnBoost.on { background: rgba(255, 140, 26, .15); border-color: var(--heat); color: var(--heat); }
  #note { color: var(--dim); font-size: 13px; text-align: center; min-height: 1.3em; margin-top: -6px; }
  details { width: 100%; color: var(--dim); font-size: 13px; }
  summary { cursor: pointer; padding: 6px 0; }
  #log { margin: 6px 0 0; padding: 10px; background: var(--panel); border-radius: 12px; max-height: 180px; overflow: auto; white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; }
  #diag { margin-top: 8px; word-break: break-word; }
  @media (prefers-reduced-motion: no-preference) { #arcVal { transition: stroke-dashoffset .6s ease, stroke .6s ease; } }
</style>
</head>
<body>

<section class="screen" id="start">
  <button id="btnConnect">Connect</button>
  <p class="hint">Turn on Bluetooth on your Ember first:<br><b>Settings › Bluetooth › Connect phone</b></p>
  <div id="msg" role="status"></div>
</section>

<section class="screen" id="live" hidden>
  <div class="bar">
    <svg class="bt" width="14" height="20" viewBox="0 0 14 20" aria-hidden="true"><path d="M2 5.5l10 9-5 4.5V1l5 4.5-10 9" fill="none" stroke="#3d8bff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span class="name" id="devName">Ember</span>
    <button id="btnDisconnect">Disconnect</button>
  </div>

  <div class="gauge">
    <svg viewBox="0 0 200 200" aria-hidden="true">
      <circle cx="100" cy="100" r="84" fill="none" stroke="#1c222b" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="395.8 527.8" transform="rotate(135 100 100)"/>
      <circle id="arcVal" cx="100" cy="100" r="84" fill="none" stroke="#5a6b7d" stroke-width="12" stroke-linecap="round"
              stroke-dasharray="395.8 527.8" stroke-dashoffset="395.8" transform="rotate(135 100 100)"/>
      <circle id="spDot" cx="100" cy="16" r="5" fill="#eef1f5"/>
    </svg>
    <div class="center">
      <div id="status">OFF</div>
      <div id="pv">---<small id="unit">°F</small></div>
      <div id="spLine">Set <b id="sp">---</b></div>
    </div>
  </div>

  <div class="meta">
    <span>Probe <b id="probe">---</b></span>
    <span id="autoOffWrap" hidden>Auto-off <b id="autoOff">-</b></span>
  </div>

  <div id="fault" hidden><span id="faultText"></span><button id="btnClear">Clear</button></div>

  <div class="set">
    <button id="btnDown" aria-label="Setpoint down">−</button>
    <div class="val"><div id="spEdit">---</div><span>Setpoint</span></div>
    <button id="btnUp" aria-label="Setpoint up">+</button>
  </div>

  <div class="actions">
    <button id="btnRun">Start</button>
    <button id="btnBoost">Boost</button>
  </div>
  <div id="note"></div>

  <details>
    <summary>Activity</summary>
    <pre id="log" aria-live="polite"></pre>
    <div id="diag"></div>
  </details>
</section>

<script type="module">
import { SERVICE, INFO, STATE, COMMAND, OP, RESULT_TEXT, FAULT_TEXT, encodeCommand, decodeInfo, decodeState, tenths, toUnit, fromUnit } from './codec.mjs';

const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent = `${new Date().toLocaleTimeString()}  ${s}\n` + $('log').textContent; };
const ARC = 395.8;  // 270° of a 84 px radius circle
const STEP = 5;     // setpoint step, display units

let dev = null, info = null, state = null, seq = 0, pending = new Map();
let spWant = null, spTimer = null;  // a setpoint being dialled in, sent when the taps stop

const hasBt = () => !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
const diag = () => `https: ${window.isSecureContext ? 'yes' : 'no'} · bluetooth: ${navigator.bluetooth ? 'yes' : 'no'} · ${navigator.userAgent}`;
function say(text, err) { $('msg').textContent = text; $('msg').classList.toggle('err', !!err); }

// ---- Bluetooth ----
async function connectBle() {
  const device = await navigator.bluetooth.requestDevice({ filters: [{ services: [SERVICE] }], optionalServices: [SERVICE] });
  say('Connecting…');
  const server = await device.gatt.connect();
  const svc = await server.getPrimaryService(SERVICE);
  const [ci, cs, cc] = await Promise.all([svc.getCharacteristic(INFO), svc.getCharacteristic(STATE), svc.getCharacteristic(COMMAND)]);
  const d = {
    name: device.name || 'Ember',
    info: decodeInfo(await ci.readValue()),
    read: async () => decodeState(await cs.readValue()),
    write: (b) => (cc.writeValueWithResponse ? cc.writeValueWithResponse(b) : cc.writeValue(b)),
    onState: async (cb) => {
      cs.addEventListener('characteristicvaluechanged', async (e) => cb(decodeState(e.target.value) || await d.read()));
      await cs.startNotifications();
    },
    disconnect: () => device.gatt.connected && device.gatt.disconnect(),
  };
  device.addEventListener('gattserverdisconnected', () => { log('Disconnected.'); showLanding('Disconnected.'); });
  return d;
}

function showLanding(text, err) {
  dev = null; state = null; pending.clear(); spWant = null;
  $('live').hidden = true; $('start').hidden = false;
  $('btnConnect').disabled = false;
  say(text || '', err);
}

$('btnConnect').onclick = async () => {
  $('diag').textContent = diag();
  if (!hasBt()) {
    say(window.isSecureContext ? 'This browser can’t use Bluetooth. On iPhone, open this page in Bluefy; elsewhere use Chrome or Edge.'
                               : 'Bluetooth needs this page over https.', true);
    return;
  }
  $('btnConnect').disabled = true;
  say('Choose your Ember…');
  try {
    dev = await connectBle();
    info = dev.info;
    log(`${info.boardName}, firmware ${info.fw}. Max ${fmt(info.spMaxC)}. Remote start ${info.remoteStart ? 'on' : 'off'}.`);
    say('Pairing… type the code shown on your Ember if asked.');
    const s = await dev.read();  // the first protected read asks to pair
    $('devName').textContent = dev.name;
    $('unit').textContent = info.fahrenheit ? '°F' : '°C';
    $('start').hidden = true; $('live').hidden = false;
    show(s);
    await dev.onState(show);
    log('Live.');
  } catch (e) {
    const m = e && e.name === 'NotFoundError' ? '' : `Couldn’t connect: ${e.message || e}`;
    if (m) log(m);
    if (dev) dev.disconnect();
    showLanding(m, !!m);
  }
};
$('btnDisconnect').onclick = () => dev && dev.disconnect();

// ---- Showing the state ----
const fmt = (c) => (c == null ? '---' : `${Math.round(toUnit(c, info?.fahrenheit))}${info?.fahrenheit ? '°F' : '°C'}`);
const disp = (c) => Math.round(toUnit(c, info.fahrenheit));

function show(s) {
  if (!s) return;
  state = s;
  const c = s.zones[0], p = s.zones[1];
  const running = c.mode === 1, tuning = c.mode === 2;
  const reached = c.pv != null && c.sp > 0 && c.pv >= c.sp - 2;
  const hot = c.pv != null && c.pv >= 51.7;
  const col = c.fault ? 'var(--fault)' : running ? (reached ? 'var(--hot)' : 'var(--heat)') : hot ? 'var(--heat)' : 'var(--off)';

  $('pv').firstChild.nodeValue = c.pv == null ? '---' : disp(c.pv);
  $('sp').textContent = fmt(c.sp) + (c.boost ? ' +boost' : '');
  const st = c.fault ? 'FAULT' : running ? `HEATING ${c.out}%` : tuning ? 'TUNING' : hot ? 'OFF · HOT' : 'OFF';
  $('status').textContent = st;
  $('status').style.color = col;

  const max = info.spMaxC || 427;
  const frac = c.pv == null ? 0 : Math.max(0, Math.min(1, c.pv / max));
  const arc = $('arcVal');
  arc.style.strokeDashoffset = String(ARC * (1 - frac));
  arc.style.stroke = col;
  const a = (135 + 270 * Math.max(0, Math.min(1, c.sp / max))) * Math.PI / 180;  // setpoint marker on the ring
  $('spDot').setAttribute('cx', (100 + 84 * Math.cos(a)).toFixed(1));
  $('spDot').setAttribute('cy', (100 + 84 * Math.sin(a)).toFixed(1));

  $('probe').textContent = p ? fmt(p.pv) : '-';
  $('autoOffWrap').hidden = !s.autoOffLeftS;
  $('autoOff').textContent = `${Math.floor(s.autoOffLeftS / 60)}:${String(s.autoOffLeftS % 60).padStart(2, '0')}`;

  const f = c.fault || (p && p.fault);
  $('fault').hidden = !f;
  $('faultText').textContent = f ? `Fault: ${FAULT_TEXT[f] || f}` : '';

  if (spWant == null) $('spEdit').textContent = disp(c.sp) + (info.fahrenheit ? '°' : '°');
  $('btnRun').textContent = running || tuning ? 'Stop' : 'Start';
  $('btnRun').classList.toggle('stop', running || tuning);
  $('btnRun').disabled = !(running || tuning) && !info.remoteStart;
  $('btnBoost').classList.toggle('on', c.boost);
  $('btnBoost').textContent = c.boost ? 'Boost on' : 'Boost';
  $('btnBoost').disabled = !running && !c.boost;
  $('note').textContent = !(running || tuning) && !info.remoteStart ? 'Start from the phone is off. Turn on Settings › Bluetooth › Remote start on your Ember.' : '';

  const want = pending.get(s.ackSeq);
  if (want && s.ackResult) {
    pending.delete(s.ackSeq);
    log(`${want}: ${RESULT_TEXT[s.ackResult] || s.ackResult}`);
    if (s.ackResult !== 1) $('note').textContent = `${want}: ${RESULT_TEXT[s.ackResult] || 'refused'}`;
  }
}

// ---- Commands ----
async function send(op, value, label) {
  if (!dev) return;
  seq = ((seq + 1) & 0xff) || 1;
  pending.set(seq, label);
  try { await dev.write(encodeCommand(seq, op, 0, value)); }
  catch (e) { pending.delete(seq); log(`${label}: not sent (${e.message || e})`); }
}

function nudge(dir) {
  if (!state) return;
  const max = Math.floor(toUnit(info.spMaxC, info.fahrenheit)), min = Math.ceil(toUnit(info.spMinC, info.fahrenheit));
  const base = spWant ?? disp(state.zones[0].sp);
  spWant = Math.max(min, Math.min(max, Math.round((base + dir * STEP) / STEP) * STEP));
  $('spEdit').textContent = spWant + '°';
  clearTimeout(spTimer);
  spTimer = setTimeout(() => {  // send once the taps stop, like the knob settling
    const d = spWant; spWant = null;
    send(OP.SETPOINT, tenths(fromUnit(d, info.fahrenheit)), `Set ${d}${info.fahrenheit ? '°F' : '°C'}`);
  }, 700);
}
$('btnUp').onclick = () => nudge(1);
$('btnDown').onclick = () => nudge(-1);
$('btnRun').onclick = () => {
  const on = state && state.zones[0].mode !== 0;
  send(on ? OP.STOP : OP.START, 0, on ? 'Stop' : 'Start');
};
$('btnBoost').onclick = () => { const on = !(state && state.zones[0].boost); send(OP.BOOST, on ? 1 : 0, on ? 'Boost' : 'Cancel boost'); };
$('btnClear').onclick = () => send(OP.CLEAR, 0, 'Clear fault');
</script>
</body>
</html>
